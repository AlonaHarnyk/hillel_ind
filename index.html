<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <section>
      <div class="img-container">
        <picture>
          <source
            media="(min-width: 1200px)"
            srcset="
              ./images/photo-desk1x.webp 1x,
              ./images/photo-desk2x.webp 2x
            "
            type="image/webp"
          />
          <source
            media="(min-width: 1200px)"
            srcset="./images/photo-desk1x.jpg 1x, ./images/photo-desk2x.jpg 2x"
            type="image/jpeg"
          />
          <source
            media="(min-width: 768px)"
            srcset="./images/photo-tab1x.webp 1x, ./images/photo-tab2x.webp 2x"
            type="image/webp"
          />
          <source
            media="(min-width: 768px)"
            srcset="./images/photo-tab1x.jpg 1x, ./images/photo-tab2x.jpg 2x"
            type="image/jpeg"
          />
          <source
            media="(max-width: 767px)"
            srcset="./images/photo-mob1x.webp 1x, ./images/photo-mob2x.webp 2x"
            type="image/webp"
          />
          <source
            media="(max-width: 767px)"
            srcset="./images/photo-mob1x.jpg 1x, ./images/photo-mob2x.jpg 2x"
            type="image/jpeg"
          />
          <img src="./images/photo-mob1x.jpg" alt="man" />
        </picture>
      </div>
    </section>
    <div class="wrapper"></div>
  </body>
</html>
